<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Control Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Rover Control Panel</h1>

  <div class="video-container">
    <img src="http://192.168.1.229:8080/?action=stream" alt="Live Camera" />
  </div>

  <div class="dpad">
    <div class="empty"></div>
    <button onclick="sendCommand('forward')">↑</button>
    <div class="empty"></div>

    <button onclick="sendCommand('left')">←</button>
    <button onclick="sendCommand('stop')">■</button>
    <button onclick="sendCommand('right')">→</button>

    <div class="empty"></div>
    <button onclick="sendCommand('backward')">↓</button>
    <div class="empty"></div>
  </div>

  <script>
    function sendCommand(direction)
    {
      console.log("Command sent:", direction);
    }
  </script>
  
</body>
</html>
