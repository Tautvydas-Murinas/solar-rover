<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Control Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>

  <h1>Rover Control Panel</h1>

  <p id="camera-status" class="status offline">Camera: checking…</p>
  <p id="arduino-status" class="status offline">Arduino: checking…</p>

  <div class="video-container">
    <img id="stream" class="stream" src="/stream.mjpg" alt="Rover camera" />
  </div>

  <div class="dpad">
    <div class="empty"></div>
    <button data-cmd="forward">↑</button>
    <div class="empty"></div>
    <button data-cmd="left">←</button>
    <button data-cmd="stop">■</button>
    <button data-cmd="right">→</button>
    <div class="empty"></div>
    <button data-cmd="backward">↓</button>
    <div class="empty"></div>
  </div>

  <p class="hint">Hold a direction button to drive. Release to stop.</p>

  <ul id="log"></ul>

  <script>
    const streamImg = document.getElementById('stream');
    const cameraStatusEl = document.getElementById('camera-status');

    function loadStream() {
      streamImg.src = `/stream.mjpg?ts=${Date.now()}`;
    }

    streamImg.addEventListener('error', () => {
      const fallback = `${location.protocol}//${location.hostname}:8000/stream.mjpg?ts=${Date.now()}`;
      if (!streamImg.src.startsWith(fallback.split('?')[0])) {
        console.warn('Proxy failed, trying port 8000');
        streamImg.src = fallback;
      } else {
        cameraStatusEl.textContent = 'Camera: stream failed — is stream.py running?';
        cameraStatusEl.className = 'status offline';
      }
    });

    streamImg.addEventListener('load', () => {
      cameraStatusEl.textContent = 'Camera: live';
      cameraStatusEl.className = 'status online';
    });

    async function checkCamera() {
      try {
        const r = await fetch(`http://${location.hostname}:8000/health`);
        const data = await r.json();
        if (data.ready) {
          cameraStatusEl.textContent = 'Camera: ready';
          cameraStatusEl.className = 'status online';
          loadStream();
        } else if (data.error) {
          cameraStatusEl.textContent = `Camera: ${data.error}`;
          cameraStatusEl.className = 'status offline';
        } else {
          cameraStatusEl.textContent = 'Camera: starting…';
        }
      } catch {
        cameraStatusEl.textContent = 'Camera: offline — run ./start-rover.sh';
        cameraStatusEl.className = 'status offline';
      }
    }

    checkCamera();

    const socket = io();
    const statusEl = document.getElementById('arduino-status');
    const logEl = document.getElementById('log');
    let activeCmd = null;

    function log(msg) {
      const li = document.createElement('li');
      li.textContent = msg;
      logEl.prepend(li);
      while (logEl.children.length > 8) {
        logEl.removeChild(logEl.lastChild);
      }
    }

    function updateStatus(serial) {
      if (serial.connected) {
        statusEl.textContent = `Arduino: connected (${serial.port})`;
        statusEl.className = 'status online';
      } else if (serial.opening) {
        statusEl.textContent = `Arduino: connecting to ${serial.port}…`;
        statusEl.className = 'status offline';
      } else if (serial.available?.length) {
        const p = serial.port || serial.available[0]?.path || 'USB';
        statusEl.textContent = `Arduino: ${p} seen — upload rover_controller.ino from PC`;
        statusEl.className = 'status offline';
      } else {
        statusEl.textContent = 'Arduino: not detected — plug USB into Pi';
        statusEl.className = 'status offline';
      }
    }

    socket.on('status', updateStatus);
    socket.on('connect', () => {
      fetch('/api/info')
        .then((r) => r.json())
        .then((info) => updateStatus(info.serial))
        .catch(() => {});
    });
    socket.on('ack', ({ command, sent }) => {
      if (!sent && command !== 'stop') {
        log(`Failed: ${command} (Arduino not connected)`);
      }
    });

    function drive(cmd) {
      if (activeCmd === cmd) return;
      activeCmd = cmd;
      socket.emit('drive', cmd);
      if (cmd !== 'stop') log(cmd);
    }

    function stopDrive() {
      if (activeCmd === 'stop' || activeCmd === null) return;
      activeCmd = 'stop';
      socket.emit('drive', 'stop');
    }

    document.querySelectorAll('.dpad button[data-cmd]').forEach((btn) => {
      const cmd = btn.dataset.cmd;

      btn.addEventListener('mousedown', (e) => {
        e.preventDefault();
        drive(cmd);
      });
      btn.addEventListener('mouseup', () => {
        if (cmd !== 'stop') stopDrive();
      });
      btn.addEventListener('mouseleave', () => {
        if (cmd !== 'stop') stopDrive();
      });

      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        drive(cmd);
      }, { passive: false });
      btn.addEventListener('touchend', () => {
        if (cmd !== 'stop') stopDrive();
      });
      btn.addEventListener('touchcancel', () => {
        if (cmd !== 'stop') stopDrive();
      });
    });

    window.addEventListener('blur', stopDrive);
  </script>
</body>

</html>
