<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Control Panel</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>

  <h1>Rover Control Panel</h1>

  <div class="video-container">
    <img class="stream" src="/stream.mjpg" alt="Rover camera" />
  </div>

  <div class="dpad">
    <div class="empty"></div>
    <button onclick="send('forward')">↑</button>
    <div class="empty"></div>
    <button onclick="send('left')">←</button>
    <button onclick="send('stop')">■</button>
    <button onclick="send('right')">→</button>

    <div class="empty"></div>
    <button onclick="send('backward')">↓</button>
    <div class="empty"></div>

    <ul id="log"></ul>
  </div>

  <script>

    const socket = io();

    socket.on('message', (msg) => {
      const li = document.createElement('li');
      li.textContent = msg;
      const log = document.getElementById('log');
      if (log) log.appendChild(li);
    });

    function send(command) {
      console.log(`You pressed: ${command}`);
      socket.emit('message', command);
    }

  </script>
</body>

</html>
